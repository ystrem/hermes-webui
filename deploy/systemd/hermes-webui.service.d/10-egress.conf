# Egress allowlist for Hermes WebUI — systemd drop-in (F2 hardening)
#
# Branch: hardening/no-telemetry (ystrem/hermes-webui)
# Status: PREPARED, NOT INSTALLED. Installing requires root; this repo
# only ships the file. Activation is deferred to the Tailscale phase
# (owner approval) — see docs/SECURITY.md §4.3.
#
# HOW TO INSTALL (root, run by operator — not automated here):
#   sudo mkdir -p /etc/systemd/system/hermes-webui.service.d
#   sudo cp deploy/systemd/hermes-webui.service.d/10-egress.conf \
#        /etc/systemd/system/hermes-webui.service.d/10-egress.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart hermes-webui
#
# REQUIREMENTS: systemd 257+ with cgroup v2. Check:
#   systemd --version | head -1          # >= 257
#   stat -fc %T /sys/fs/cgroup           # cgroup2fs
#
# WHY ONLY LOOPBACK: WebUI's only network dependency is the Hermes
# gateway at http://127.0.0.1:8642 (api/gateway_chat.py:301-309,
# overridable via HERMES_API_URL). `localhost` in IPAddressAllow
# covers 127.0.0.0/8 and ::1, which is everything the service
# legitimately uses. There are no runtime CDN/telemetry requests
# (F0/F1 audit: docs/NETWORK-AUDIT.md).
#
# TAILSCALE PHASE (do NOT enable before tailscale is up on the host):
#   IPAddressAllow=100.64.0.0/10        # Tailscale CGNAT range
# Without it, `tailscale serve` proxying to this service would be
# blocked by IPAddressDeny=any once Tailscale is installed.
#
# NOTE for LAN test mode: this drop-in is for the loopback-bind
# production mode. In LAN test mode (HERMES_WEBUI_HOST=0.0.0.0) the
# UI must stay reachable from LAN clients, so do NOT install this
# drop-in until the Tailscale phase.

[Service]
IPAddressDeny=any
IPAddressAllow=localhost
